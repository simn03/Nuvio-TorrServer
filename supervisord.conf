[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0

# Sibling TorrServer. The data-dir flag is --path (-d), NOT --datadir (verified
# against MatriX releases). Bound to 8090 and never exposed outside the container.
[program:torrserver]
command=/bin/sh -c '/usr/local/bin/torrserver --port 8090 --path /data/torrserver 2>&1 | /app/addon logwrap --source torrserver'
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:addon]
command=/app/addon serve
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
