name: Release

# Publishes the multi-arch image to GHCR once CI passes.
#   - push to main     -> :latest, :sha-<short>
#   - push tag vX.Y.Z  -> :X.Y.Z, :X.Y, :latest, :sha-<short> + a GitHub Release
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/simn03/nuvio-torrserver

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    # workflow_dispatch can target any branch; only main and release tags may
    # publish to the production package.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      # Tags stamp their version into the manifest; main builds keep the
      # source default so :latest never reports a lower version than a release.
      - name: Resolve version
        id: version
        if: github.ref_type == 'tag'
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # Release body, in order: docs/releases/vX.Y.x.md (breaking changes for
      # the whole X.Y series, repeated on every X.Y.* release), then
      # docs/releases/<tag>.md (this release), then generated PR notes.
      - name: Compose release notes
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          series="${GITHUB_REF_NAME%.*}.x"   # v0.2.1 -> v0.2.x
          {
            for notes in "docs/releases/${series}.md" "docs/releases/${GITHUB_REF_NAME}.md"; do
              if [[ -f "$notes" ]]; then cat "$notes"; echo; fi
            done
            echo '## Image'
            echo '```sh'
            echo "docker pull ${IMAGE}:${VERSION}"
            echo '```'
          } > "$RUNNER_TEMP/release-notes.md"

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: ${{ runner.temp }}/release-notes.md
