name: CI

# Runs on every PR: vet, tests, a vulnerability scan, and a
# (non-pushing) image build so Dockerfile breakage — e.g. an upstream TorrServer
# asset disappearing — fails the PR instead of the release. release.yml reuses
# this as its gate on main/tags.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Latest 1.26 patch (matches golang:1.26-alpine in the Dockerfile) so
      # stdlib security fixes land without bumping go.mod.
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image (amd64, no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: nuvio-torrserver:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test image
        run: |
          docker run --rm --entrypoint sh nuvio-torrserver:ci -c \
            'test -x /usr/local/bin/torrserver && test -x /app/addon && /app/addon 2>&1 | grep -q Usage'
